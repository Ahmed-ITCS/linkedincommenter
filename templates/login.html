<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LI Bot — Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:       #0a0a0f;
    --surface:  #111118;
    --border:   #1e1e2e;
    --accent:   #00e5ff;
    --accent2:  #7c3aed;
    --text:     #e2e8f0;
    --muted:    #64748b;
    --danger:   #f43f5e;
    --mono:     'IBM Plex Mono', monospace;
    --sans:     'IBM Plex Sans', sans-serif;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* animated grid background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,229,255,.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,229,255,.03) 1px, transparent 1px);
    background-size: 40px 40px;
    animation: gridScroll 20s linear infinite;
    pointer-events: none;
  }

  @keyframes gridScroll {
    from { transform: translateY(0); }
    to   { transform: translateY(40px); }
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 48px 40px;
    width: 100%;
    max-width: 380px;
    position: relative;
    box-shadow: 0 0 60px rgba(0,229,255,.05), 0 24px 64px rgba(0,0,0,.6);
  }

  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--accent2), var(--accent));
  }

  .label-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 32px;
  }

  .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent);
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50%       { opacity: .3; }
  }

  h1 {
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .15em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .title {
    font-family: var(--mono);
    font-size: 22px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 8px;
  }

  .subtitle {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 32px;
    font-family: var(--mono);
  }

  label {
    display: block;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
  }

  input[type="password"] {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 12px 14px;
    font-family: var(--mono);
    font-size: 14px;
    color: var(--text);
    outline: none;
    transition: border-color .2s;
    margin-bottom: 20px;
  }

  input[type="password"]:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(0,229,255,.08);
  }

  button {
    width: 100%;
    background: transparent;
    border: 1px solid var(--accent);
    color: var(--accent);
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .12em;
    text-transform: uppercase;
    padding: 13px;
    border-radius: 3px;
    cursor: pointer;
    transition: background .2s, color .2s, box-shadow .2s;
  }

  button:hover {
    background: var(--accent);
    color: var(--bg);
    box-shadow: 0 0 24px rgba(0,229,255,.3);
  }

  .error {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--danger);
    margin-bottom: 16px;
    padding: 10px 12px;
    border: 1px solid rgba(244,63,94,.2);
    border-radius: 3px;
    background: rgba(244,63,94,.05);
  }
</style>
</head>
<body>
<div class="card">
  <div class="label-row">
    <div class="dot"></div>
    <h1>LinkedIn Bot</h1>
  </div>
  <div class="title">Access Control</div>
  <div class="subtitle">// enter password to continue</div>

  {% if error %}
  <div class="error">⚠ {{ error }}</div>
  {% endif %}

  <form method="POST">
    <label for="password">Password</label>
    <input type="password" id="password" name="password" autofocus placeholder="········">
    <button type="submit">Authenticate →</button>
  </form>
</div>
</body>
</html>
